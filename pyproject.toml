[project]
name = "histo-taskqueue"
version = "0.1.0"
description = "A task queue for AlphaFold Server job files, with a Histo.fyi-styled UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris Thorpe" }]
dependencies = [
    "flask>=3.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0"]

[project.scripts]
histo-taskqueue = "histo_taskqueue.app:main"
histo-worker = "histo_taskqueue.worker:main"
histo-taskqueue-keys = "histo_taskqueue.manage:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["histo_taskqueue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
